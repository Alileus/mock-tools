version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
    ignore:
      # Remove when @astrojs/check supports TypeScript 7.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Riyadh
    groups:
      actions:
        patterns: ["*"]
